apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: ghcr.io/faanrm/order-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_QUEUE
              value: "order_processing_queue"
---
apiVersion: v1
kind: Service
metadata:
  name: order-api-service
spec:
  type: NodePort
  selector:
    app: order-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
