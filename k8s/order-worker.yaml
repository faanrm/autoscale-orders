apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
        - name: order-worker
          image: ghcr.io/faanrm/order-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_QUEUE
              value: "order_processing_queue"
