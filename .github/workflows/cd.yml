name: CD - Continuous Delivery

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: [ "CI - Continuous Integration" ]
    types:
      - completed

jobs:
  validate-and-deploy-k8s:
    name: 1. Validate & Deploy Kubernetes Manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Ephemeral Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: test-cluster
          wait: 60s

      - name: Deploy & Validate Manifests in Cluster
        run: |
          echo "Applying Redis Manifest..."
          kubectl apply -f k8s/redis.yaml

          echo "Applying Order API Manifest..."
          kubectl apply -f k8s/order-api.yaml

          echo "Applying Order Worker Manifest..."
          kubectl apply -f k8s/order-worker.yaml

          echo "Applying Monitoring Manifest..."
          kubectl apply -f k8s/monitoring.yaml

          echo "Checking deployments..."
          kubectl get deployments -A

      - name: Validate Terraform Syntax
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - run: |
          cd terraform
          terraform init -backend=false
          terraform validate
