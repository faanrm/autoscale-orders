name: CI - Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build-typescript:
    name: 1. Test & Compile TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            services/order-api/package-lock.json
            services/order-worker/package-lock.json

      - name: Build Order API
        run: |
          cd services/order-api
          npm ci
          npm run build

      - name: Build Order Worker
        run: |
          cd services/order-worker
          npm ci
          npm run build

  build-and-push-ghcr:
    name: 2. Build & Push to GHCR (GitHub Packages)
    needs: test-and-build-typescript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Order API Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/faanrm/order-api:latest
            ghcr.io/faanrm/order-api:${{ github.sha }}

      - name: Build & Push Order Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/faanrm/order-worker:latest
            ghcr.io/faanrm/order-worker:${{ github.sha }}
